series: Mercy's Flame lecture
context: |
  Spoken dictation / lecture in the Summit Lighthouse current (Keepers of the Flame).
  Elevated liturgical English into natural spoken Russian of the same register.
  Keep theosophical names in their usual Russian forms; do not invent new spellings.

names:
